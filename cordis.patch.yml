# dsh-workbench：一个组合包，一样功能一行。DSH 只在有一行直接以包名挂载时才
# 加载包的 ./client（网页部分），所以根行 dsh-workbench 的名字是包本身；关掉根行，
# 网页部分和 /api/dsh-workbench.* 路由一起消失。
# 各行在自己的 apply 里向根行的功能登记处报到；GET /api/dsh-workbench.features
# 按当前开着的行回答。
# 行 id 在整个 profile 里共用一个命名空间，所以都带 dsh-workbench 前缀：用 web、
# tasks 这类通用 id 会顶掉官方同 id 的行（2026-11-05 桌面端实测：根行叫 web 时，
# 官方联网服务没加载，新建会话报 tool-web「waiting for web」）。
# 原生分组等待 bundle-guard 的许可，再挂载原有功能行。行 ID 仍可由 profile 覆盖。
- insert:
    - id: dsh-workbench-bundle-guard
      name: '@miint-sunny/dsh-workbench/bundle-guard'
      group: true
      config: { bundle: dsh-workbench }
    - id: dsh-workbench-bundle-status
      name: '@miint-sunny/dsh-workbench/bundle-guard'
      inject: [dsh-workbench.bundle-state]
      config: { bundle: dsh-workbench, report: true }
    - id: dsh-workbench-bundle
      name: cordis:group
      group: true
      inject: [dsh-workbench.bundle-allowed]
      config: []
- id: dsh-workbench-bundle
  insert:
    - id: dsh-workbench
      name: '@miint-sunny/dsh-workbench'
    - id: dsh-workbench-tasks
      name: '@miint-sunny/dsh-workbench/tasks'
    - id: dsh-workbench-notify
